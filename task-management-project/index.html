<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container">
      <h1>Task Management App</h1>
      <p>Organize your tasks, track your progress and stay productive.</p>
    </div>
  </header>

  <main class="container">

    <section class="statistics-section">
      <div class="section-heading">
        <h2>Task Statistics</h2>
      </div>

      <div class="statistics">

        <div class="stat-card total">
          <div class="stat-icon"></div>
          <div>
            <span class="stat-label">Total Tasks</span>
            <span class="stat-number" id="totalCount">0</span>
          </div>
        </div>

        <div class="stat-card completed-card">
          <div class="stat-icon"></div>
          <div>
            <span class="stat-label">Completed</span>
            <span class="stat-number" id="completedCount">0</span>
          </div>
        </div>

        <div class="stat-card pending-card">
          <div class="stat-icon"></div>
          <div>
            <span class="stat-label">Pending</span>
            <span class="stat-number" id="pendingCount">0</span>
          </div>
        </div>

      </div>
    </section>

    <section class="progress-section">
      <div class="section-heading">
        <h2>Progress</h2>
        <span id="progressText">0% Complete</span>
      </div>

      <div
        class="progress-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill"></div>
      </div>
    </section>

    <section class="dashboard">

      <div class="task-list-section">

        <div class="section-heading">
          <h2>Task List</h2>
          <span id="taskCount">0 Tasks</span>
        </div>

        <div class="task-controls">
          <div class="filter-buttons">

            <button type="button" class="filter-btn active" data-filter="all">
              All <span id="allFilterCount">0</span>
            </button>

            <button type="button" class="filter-btn" data-filter="pending">
              Pending <span id="pendingFilterCount">0</span>
            </button>

            <button type="button" class="filter-btn" data-filter="completed">
              Completed <span id="completedFilterCount">0</span>
            </button>

          </div>

          <div class="task-tools">

            <input
              type="search"
              id="searchInput"
              placeholder="Search tasks..."
              aria-label="Search tasks"
            >

            <select id="sortSelect" aria-label="Sort tasks">
              <option value="default">Sort: Default</option>
              <option value="dueDate">Sort: Due Date</option>
              <option value="title">Sort: Title</option>
              <option value="priority">Sort: Priority</option>
            </select>
          </div>
        </div>

        <div class="task-list" id="taskList"></div>
        <button type="button" class="open-form-btn" id="openFormBtn"> Add New Task </button>
      </div>

    </section>

    <section class="calculator-section">
      <div class="section-heading">
        <h2>Quick Calculator</h2>
      </div>

      <div class="calculator" id="calculator">

        <input type="text" id="calculatorDisplay" readonly aria-label="Calculator display">

        <div class="calculator-buttons">

          <button type="button" data-value="/">÷</button>
          <button type="button" data-value="*">×</button>
          <button type="button" data-value="-">−</button>
          <button type="button" data-value="+">+</button>

          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" data-value=".">.</button>

          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" data-value="3">3</button>

          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="0">0</button>
          <button type="button" data-action="calculate">=</button>

          <button type="button" data-action="clear" class="clear-button"> Clear </button>

        </div>
      </div>

    </section>

  </main>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">

        <h2 id="modalTitle">Add New Task</h2>

        <button type="button" class="close-modal" id="closeModalBtn" aria-label="Close task form">
          ×
        </button>

      </div>

      <form id="taskForm">

        <div class="form-group">
          <label for="taskTitle">Task Title</label>
          <input
            type="text"
            id="taskTitle"
            placeholder="Enter task title"
          >
        </div>

        <div class="form-group">
          <label for="taskCategory">Category</label>

          <select id="taskCategory">
            <option value="">Select category</option>
            <option value="Study">Study</option>
            <option value="University">Practice</option>
            <option value="Design">Design</option>
            <option value="Personal">Personal</option>
          </select>
        </div>

        <div class="form-group">
          <label for="taskPriority">Priority</label>

          <select id="taskPriority">
            <option value="">Select priority</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="form-group">
          <label for="taskDate">Due Date</label>
          <input type="date" id="taskDate">
        </div>

        <p id="formMessage" class="form-message"></p>

        <div class="form-actions">

          <button type="submit" class="add-task-btn" id="submitTaskBtn">
            Add Task
          </button>

          <button type="button" class="cancel-btn" id="cancelEditBtn" hidden>
            Cancel Edit
          </button>

        </div>
      </form>
    </div>

  </div>

  <footer>
    <div class="container">
      <p>Alisha Saeed</p>
      <p>Internship at Lumovy Technology Solutions</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
